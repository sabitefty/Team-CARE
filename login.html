<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C.A.R.E Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Rajdhani',sans-serif;
  background:#040810; color:#e8eaf6;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
/* animated bg */
body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 50% 60% at 30% 40%, rgba(41,121,255,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 50% at 70% 60%, rgba(0,229,255,0.04) 0%, transparent 55%);
}
.login-card {
  position:relative; z-index:1;
  background:rgba(12,22,40,0.8); border:1px solid rgba(41,121,255,0.2);
  border-radius:20px; padding:48px 40px; width:min(420px,90vw);
  backdrop-filter:blur(20px);
  box-shadow:0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(41,121,255,0.08) inset;
}
.login-logo {
  text-align:center; margin-bottom:32px;
}
.login-logo .brand {
  font-family:'Bebas Neue'; font-size:42px; letter-spacing:8px;
  background:linear-gradient(135deg,#2979ff,#00e5ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.login-logo .sub { font-size:11px; letter-spacing:4px; color:#7986cb; text-transform:uppercase; margin-top:4px; }
.form-group { margin-bottom:20px; }
.form-group label { display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#7986cb; margin-bottom:8px; }
.form-group input {
  width:100%; background:rgba(7,13,26,0.8); border:1px solid rgba(41,121,255,0.2);
  color:#e8eaf6; padding:12px 16px; border-radius:10px;
  font-family:'Rajdhani',sans-serif; font-size:15px; outline:none;
  transition:border-color 0.2s;
}
.form-group input:focus { border-color:#2979ff; }
.login-btn {
  width:100%; background:linear-gradient(135deg,#2979ff,#1a4fd6);
  color:#fff; border:none; padding:14px; border-radius:10px;
  font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700;
  letter-spacing:3px; text-transform:uppercase; cursor:pointer;
  transition:all 0.2s; margin-top:8px;
}
.login-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(41,121,255,0.4); }
.login-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.error-msg { background:rgba(255,23,68,0.1); border:1px solid rgba(255,23,68,0.3); border-radius:8px; padding:10px 14px; font-size:13px; color:#ff5370; margin-top:16px; display:none; }
.error-msg.show { display:block; }
.login-note { text-align:center; font-size:11px; color:#546e7a; margin-top:20px; letter-spacing:1px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="brand">C.A.R.E</div>
    <div class="sub">Admin Panel Access</div>
  </div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="admin@teamcare.com.bd" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()">
  </div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">Access Panel</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="login-note">Authorized personnel only</div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "teamcare-bd.firebaseapp.com",
  projectId:         "teamcare-bd",
  storageBucket:     "teamcare-bd.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId:             "YOUR_APP_ID"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

window.doLogin = async function() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('errorMsg');
  errEl.classList.remove('show');

  if (!email || !password) { errEl.textContent = 'Please enter email and password.'; errEl.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Verifying...';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const adminDoc = await getDoc(doc(db, 'admins', cred.user.uid));
    if (!adminDoc.exists()) {
      await auth.signOut();
      throw new Error('Access denied. Not an admin account.');
    }
    window.location.href = 'dashboard.html';
  } catch (err) {
    const msgs = {
      'auth/user-not-found':  'No account with this email.',
      'auth/wrong-password':  'Incorrect password.',
      'auth/too-many-requests': 'Too many attempts. Try later.',
    };
    errEl.textContent = msgs[err.code] || err.message;
    errEl.classList.add('show');
    btn.disabled = false; btn.textContent = 'Access Panel';
  }
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/renderer.js"></script>
</body>
</html>
